version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: financial-approval-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - checkpoint-data:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: financial-approval-frontend
    ports:
      - "3000:3000"
    environment:
      - LANGGRAPH_DEPLOYMENT_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  checkpoint-data:
